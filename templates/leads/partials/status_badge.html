{% if status == 'converted' %}
  <span class="rounded-full border border-emerald-400/30 bg-emerald-400/10 px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-emerald-300">Converted</span>
{% elif status == 'qualified' %}
  <span class="rounded-full border border-indigo-400/40 bg-indigo-400/10 px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-indigo-200">Qualified</span>
{% elif status == 'contacted' %}
  <span class="rounded-full border border-cyan-400/40 bg-cyan-400/10 px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-cyan-200">Contacted</span>
{% elif status == 'lost' %}
  <span class="rounded-full border border-red-400/30 bg-red-400/10 px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-red-200">Lost</span>
{% else %}
  <span class="rounded-full border border-slate-600/70 bg-slate-800/60 px-3 py-1.5 text-xs font-bold uppercase tracking-wide text-slate-300">New</span>
{% endif %}

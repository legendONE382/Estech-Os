<section class="mx-auto max-w-3xl rounded-[2rem] border border-red-400/30 bg-red-500/10 p-8 text-center backdrop-blur-md">
  <p class="text-sm font-semibold uppercase tracking-[0.3em] text-red-200">Workspace unavailable</p>
  <h1 class="mt-4 text-3xl font-semibold text-white">Your session needs attention.</h1>
  <p class="mt-3 text-sm leading-6 text-red-100/80">We could not locate a tenant profile for this account. Please sign out and register a workspace, or contact an administrator.</p>
  <form method="post" action="{% url 'logout' %}" class="mt-6">
    {% csrf_token %}
    <button type="submit" class="rounded-2xl bg-red-300 px-5 py-3 text-sm font-bold text-red-950">Sign out securely</button>
  </form>
</section>

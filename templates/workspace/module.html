<section class="mx-auto max-w-7xl space-y-8">
  <div class="rounded-[2rem] border border-slate-800/80 bg-slate-900/60 p-8 backdrop-blur-md">
    <p class="text-sm font-semibold uppercase tracking-[0.35em] text-emerald-300">{{ eyebrow }}</p>
    <h1 class="mt-3 text-4xl font-semibold tracking-tight text-white md:text-5xl">{{ title }}</h1>
    <p class="mt-4 max-w-3xl text-sm leading-6 text-slate-400">{{ description }}</p>
  </div>

  <div class="grid gap-4 md:grid-cols-3">
    {% for card in cards %}
      <article class="rounded-3xl border border-slate-800/80 bg-slate-900/60 p-6 backdrop-blur-md transition-all duration-300 ease-in-out hover:-translate-y-1 hover:border-emerald-500/40 hover:shadow-[0_0_15px_rgba(16,185,129,0.1)]">
        <p class="text-sm font-medium text-slate-400">{{ card.label }}</p>
        <p class="mt-4 text-3xl font-semibold text-white">{{ card.value }}</p>
        <p class="mt-4 text-sm leading-6 text-slate-500">{{ card.description }}</p>
      </article>
    {% endfor %}
  </div>
</section>
